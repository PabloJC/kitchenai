name: Project board

# Mantiene el tablero sincronizado con lo que pasa de verdad en el repositorio:
#
#   issue creada          -> Todo
#   PR abierta            -> In progress   (para las issues que la PR cierra)
#   revisión aprobada     -> In review
#   PR mergeada           -> Done
#
# El GITHUB_TOKEN de Actions no puede tocar Projects: hace falta un PAT con
# scope `project` en el secret PROJECT_TOKEN. Ver docs/infra.md.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, closed]
  # ------------------------------------------------------------------ #
  # Los eventos generados con el GITHUB_TOKEN no disparan workflows. Es
  # el cortafuegos de GitHub contra los bucles, y deja mudas justo las
  # dos transiciones finales de este tablero:
  #
  #   - `ai-code-review` pone `ai-review:approved` con el GITHUB_TOKEN
  #     cuando no hay AI_REVIEWER_TOKEN => no hay evento `labeled`.
  #   - `auto-merge` mergea con el GITHUB_TOKEN => no hay evento `closed`.
  #
  # Sin esto, «In review» y «Done» no llegan nunca por mucho que el PAT
  # del tablero sea correcto. `workflow_run` sí se entrega: se escucha el
  # final de esos dos workflows y se deduce la columna del estado real.
  # ------------------------------------------------------------------ #
  workflow_run:
    workflows: ["AI Code Review", "Auto-merge"]
    types: [completed]
  # Para recolocar una tarjeta a mano cuando el tablero se ha quedado desfasado
  # (un fallo del PAT, una issue creada antes de existir el tablero).
  workflow_dispatch:
    inputs:
      issue:
        description: Número de la issue
        required: true
      status:
        description: Columna de destino
        required: true
        default: In progress

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: project-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar tablero
    runs-on: ubuntu-latest
    # Sin PAT no hay nada que hacer: mejor saltarse el job que fallar en cada
    # evento del repositorio con un error de permisos.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ai-review:approved' }}

    steps:
      - uses: actions/checkout@v5

      - name: Mover la tarjeta
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Todo lo que se lee del repositorio —la PR, su cuerpo, sus
          # etiquetas, el node id de la issue— sale del token de Actions, que
          # ya puede hacerlo. Así el PAT del tablero sólo necesita `project`.
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${PROJECT_NUMBER:-}" ]; then
            echo "Falta PROJECT_TOKEN o la variable PROJECT_NUMBER. No se toca el tablero."
            exit 0
          fi

          chmod +x scripts/project-item-status.sh

          # ---------------------------------------------------------- #
          # Ejecución manual: la issue y la columna vienen dadas.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ./scripts/project-item-status.sh "$INPUT_ISSUE" "$INPUT_STATUS"
            exit 0
          fi

          # ---------------------------------------------------------- #
          # Issues: entran en Todo.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "issues" ]; then
            ./scripts/project-item-status.sh "$ISSUE_NUM" "Todo"
            exit 0
          fi

          # ---------------------------------------------------------- #
          # Qué PRs mirar.
          #
          # `workflow_run` no trae la PR en el payload, sólo el SHA. Este
          # endpoint la encuentra igualmente, y —a diferencia de buscar
          # entre las PRs abiertas— también cuando ya está mergeada y la
          # rama borrada, que es exactamente el caso de «Done».
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "workflow_run" ]; then
            PRS=$(GH_TOKEN="$REPO_TOKEN" gh api "/repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[].number' || true)
          else
            PRS="${PR_NUM:-}"
          fi

          if [ -z "$PRS" ]; then
            echo "Ninguna PR corresponde a este evento."
            exit 0
          fi

          for PR in $PRS; do
            echo "::group::PR #$PR"

            DATA=$(GH_TOKEN="$REPO_TOKEN" gh pr view "$PR" --json state,body,labels)
            STATE=$(echo "$DATA" | jq -r .state)
            APPROVED=$(echo "$DATA" | jq -r \
                       '[.labels[].name] | index("ai-review:approved") != null')

            # -------------------------------------------------------- #
            # La columna sale del ESTADO REAL de la PR, no de qué evento
            # nos despertó. Dos consecuencias que valen el rodeo: el
            # mismo evento repetido es inofensivo, y un evento perdido lo
            # corrige el siguiente que llegue en vez de dejar la tarjeta
            # encallada para siempre.
            #
            # `closed` sin merge no mueve nada: la issue sigue viva y su
            # tarjeta debe quedarse donde estaba, no volver atrás.
            # -------------------------------------------------------- #
            case "$STATE" in
              MERGED) DESTINO="Done" ;;
              OPEN)
                if [ "$APPROVED" = "true" ]; then
                  DESTINO="In review"
                else
                  DESTINO="In progress"
                fi
                ;;
              CLOSED)
                echo "PR cerrada sin mergear: la tarjeta se queda como está."
                echo "::endgroup::"; continue
                ;;
              *) echo "Estado '$STATE' inesperado."; echo "::endgroup::"; continue ;;
            esac

            # -------------------------------------------------------- #
            # Qué issues cierra esta PR. Sólo las palabras que GitHub
            # reconoce como cierre; una mención suelta a #7 no significa
            # que la PR resuelva la issue 7.
            # -------------------------------------------------------- #
            ISSUES=$(echo "$DATA" | jq -r '.body // ""' \
                     | grep -oiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed)) +#[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u || true)

            if [ -z "$ISSUES" ]; then
              echo "La PR no declara cerrar ninguna issue (Closes #N). Nada que mover."
              echo "::endgroup::"; continue
            fi

            for N in $ISSUES; do
              ./scripts/project-item-status.sh "$N" "$DESTINO"
            done

            echo "::endgroup::"
          done
