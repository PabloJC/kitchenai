name: Project board

# Keeps the board in sync with what actually happens in the repository:
#
#   issue opened     -> Todo
#   PR opened        -> In progress   (for the issues the PR closes)
#   review approved  -> In review
#   PR merged        -> Done
#
# The Actions GITHUB_TOKEN cannot reach Projects: PROJECT_TOKEN must hold a PAT with the
# `project` scope. See docs/infra.md.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, closed]
  # ------------------------------------------------------------------ #
  # Events created with the GITHUB_TOKEN do not trigger workflows. That is GitHub's guard
  # against loops, and it silences exactly the two closing moves of this board:
  #
  #   - `ai-code-review` labels with the GITHUB_TOKEN when AI_REVIEWER_TOKEN is unset,
  #     so no `labeled` event.
  #   - `auto-merge` merges with the GITHUB_TOKEN, so no `closed` event.
  #
  # Without this, «In review» and «Done» never arrive however correct the board PAT is.
  # `workflow_run` is delivered, so we listen for those two finishing and derive the column
  # from the pull request's real state.
  # ------------------------------------------------------------------ #
  workflow_run:
    workflows: ["AI Code Review", "Auto-merge"]
    types: [completed]
  # To put a card back by hand when the board has drifted — a PAT failure, an issue created
  # before the board existed.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      status:
        description: Target column
        required: true
        default: In progress

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: project-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the board
    runs-on: ubuntu-latest
    # Without the PAT there is nothing to do: better to skip the job than to fail on every
    # repository event with a permissions error.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ai-review:approved' }}

    steps:
      - uses: actions/checkout@v5

      - name: Move the card
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Everything read from the repository — the pull request, its body, its labels,
          # the issue's node id — goes through the Actions token, so the board PAT only
          # needs `project`.
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${PROJECT_NUMBER:-}" ]; then
            echo "PROJECT_TOKEN or PROJECT_NUMBER missing. Leaving the board alone."
            exit 0
          fi

          chmod +x scripts/project-item-status.sh

          # ---------------------------------------------------------- #
          # Manual run: the issue and the column are given.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ./scripts/project-item-status.sh "$INPUT_ISSUE" "$INPUT_STATUS"
            exit 0
          fi

          # ---------------------------------------------------------- #
          # Issues: they land in Todo.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "issues" ]; then
            ./scripts/project-item-status.sh "$ISSUE_NUM" "Todo"
            exit 0
          fi

          # ---------------------------------------------------------- #
          # Which pull requests to look at.
          #
          # `workflow_run` carries no pull request, only the SHA. This endpoint still finds
          # it once merged with the branch deleted, which is exactly the «Done» case.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "workflow_run" ]; then
            PRS=$(GH_TOKEN="$REPO_TOKEN" gh api "/repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[].number' || true)
          else
            PRS="${PR_NUM:-}"
          fi

          if [ -z "$PRS" ]; then
            echo "No pull request matches this event."
            exit 0
          fi

          for PR in $PRS; do
            echo "::group::PR #$PR"

            DATA=$(GH_TOKEN="$REPO_TOKEN" gh pr view "$PR" --json state,body,labels)
            STATE=$(echo "$DATA" | jq -r .state)
            APPROVED=$(echo "$DATA" | jq -r \
                       '[.labels[].name] | index("ai-review:approved") != null')

            # -------------------------------------------------------- #
            # The column comes from the pull request's REAL STATE, not from the event that
            # woke us. A repeated event is then harmless, and a lost one is repaired by the
            # next of any kind instead of stranding the card.
            #
            # `closed` without a merge moves nothing: the issue is still alive and its card
            # stays where it was.
            # -------------------------------------------------------- #
            case "$STATE" in
              MERGED) TARGET="Done" ;;
              OPEN)
                if [ "$APPROVED" = "true" ]; then
                  TARGET="In review"
                else
                  TARGET="In progress"
                fi
                ;;
              CLOSED)
                echo "Pull request closed without merging: the card stays as it is."
                echo "::endgroup::"; continue
                ;;
              *) echo "Unexpected state '$STATE'."; echo "::endgroup::"; continue ;;
            esac

            # -------------------------------------------------------- #
            # Which issues this pull request closes. Only the words GitHub recognises as
            # closing: a bare mention of #7 does not mean it resolves issue 7.
            # -------------------------------------------------------- #
            ISSUES=$(echo "$DATA" | jq -r '.body // ""' \
                     | grep -oiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed)) +#[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u || true)

            if [ -z "$ISSUES" ]; then
              echo "The pull request closes no issue (Closes #N). Nothing to move."
              echo "::endgroup::"; continue
            fi

            for N in $ISSUES; do
              ./scripts/project-item-status.sh "$N" "$TARGET"
            done

            echo "::endgroup::"
          done
