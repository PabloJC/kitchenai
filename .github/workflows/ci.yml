name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  # ---------------------------------------------------------------- #
  # Static analysis: fast, fails early.
  # ---------------------------------------------------------------- #
  static-analysis:
    name: Lint & Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          else
            cp androidApp/google-services.json.template androidApp/google-services.json
          fi

      - run: ./gradlew detekt --continue
      - run: ./gradlew ktlintCheck --continue

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------- #
  # JVM tests of the shared code.
  # `check` rather than a specific task name: the
  # com.android.kotlin.multiplatform.library plugin renamed the test tasks, and `check`
  # resolves whichever exist in each module.
  # ---------------------------------------------------------------- #
  shared-tests:
    name: Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          else
            cp androidApp/google-services.json.template androidApp/google-services.json
          fi

      # No exclusions: `check` re-runs detekt and ktlint from the previous job. A minute
      # more, in exchange for not depending on task names that KMP varies per source set
      # (ktlintCommonMainSourceSetCheck, ktlintAndroidMainSourceSetCheck, ...) and which
      # fail the command by ambiguity.
      - run: ./gradlew :shared:check :composeApp:check

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------- #
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          else
            cp androidApp/google-services.json.template androidApp/google-services.json
          fi

      - run: ./gradlew :androidApp:assembleDebug

  # ---------------------------------------------------------------- #
  # macOS minutes are expensive: build and test the Apple targets only.
  # ---------------------------------------------------------------- #
  build-ios:
    name: Build iOS framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Mind the path: the file lives in iosApp/, not iosApp/iosApp/. With the wrong
          # one this step does nothing and the job still passes because the file was
          # committed — green for the wrong reason.
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/GoogleService-Info.plist
          else
            echo "::error::The GOOGLE_SERVICE_INFO_PLIST secret is missing."
            exit 1
          fi

      # Link only: Kotlin/Native tests are disabled because the linker cannot find the
      # iOS Firebase frameworks, which Xcode supplies through SPM. See docs/infra.md.
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

  # ---------------------------------------------------------------- #
  # Firestore rules, executed against the emulator. No secret and no real project: the
  # `demo-` project id keeps the emulator from ever reaching a Firebase backend.
  # ---------------------------------------------------------------- #
  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the rules test dependencies
        working-directory: firebase/tests
        run: npm install --no-audit --no-fund

      - name: Run the rules tests
        working-directory: firebase/tests
        run: npm test

  # ---------------------------------------------------------------- #
  # Aggregated check: the only one marked as required on main.
  # ---------------------------------------------------------------- #
  ci-passed:
    name: CI passed
    if: always()
    needs: [static-analysis, shared-tests, build-android, build-ios, firestore-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::A CI job failed"; exit 1; }
          echo "Every CI job green."
