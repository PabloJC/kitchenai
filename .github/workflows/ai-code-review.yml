name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write        # required by the Claude action

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------ #
      # The skip must NOT live in the job's `if:`. This job is a required status check: if
      # it does not run it does not report, and a pull request waiting on a check that never
      # arrives is blocked for good. This way the job always finishes, green, without
      # reviewing.
      # ------------------------------------------------------------ #
      - name: Should we review?
        id: gate
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ai-review') }}
        run: |
          if [ "$DRAFT" = "true" ] || [ "$SKIP_LABEL" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Draft or skip-ai-review label: not reviewing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0        # Claude needs the history for the diff

      # ------------------------------------------------------------ #
      # Claude reviews the diff against CLAUDE.md, leaves inline comments and publishes its
      # own summary comment.
      #
      # The verdict travels as a sentinel line at the end of the response rather than as
      # structured_output: `--json-schema` always came back empty, with no error and no
      # explanation. A text sentinel is immune to the transcript's format.
      # ------------------------------------------------------------ #
      - name: Review with Claude
        id: claude
        if: steps.gate.outputs.skip != 'true'
        # The action's failure does not decide the check: the verdict does, in the next
        # step. Without this, exhausting the turn budget aborts the job and skips both the
        # label and the gate, leaving an approved pull request with no verdict and a red
        # check.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `track_progress`: it produces a tracking comment with tickable boxes, and a
          # review is not a to-do list. Without it, the review is the inline comments plus a
          # short summary.
          #
          # Denials only here. The allow list goes in --allowedTools:
          # `settings.permissions.allow` does not always reach the SDK, and Claude ends up
          # hitting denials when trying to comment.
          settings: |
            {
              "permissions": {
                "deny": ["Write", "Edit", "Bash(git push:*)", "Bash(git commit:*)"]
              }
            }
          # No --model: the action's default.
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
          prompt: |
            Eres el revisor de código del proyecto KitchenAI (Kotlin Multiplatform + Compose Multiplatform + Firebase).

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} — "${{ github.event.pull_request.title }}"
            BASE: ${{ github.event.pull_request.base.ref }}

            Lee `CLAUDE.md` antes de opinar: contiene las reglas vinculantes de este repositorio.

            Revisa ÚNICAMENTE el diff de esta PR.

            CÓMO PUBLICAR LA REVISIÓN — esto no es opcional. Tu respuesta en el chat no la
            lee nadie; si no publicas en GitHub, la revisión no existe.

            - El grueso de la revisión son **comentarios en el código**:
              `mcp__github_inline_comment__create_inline_comment` con `confirmed: true`,
              en el fichero y la línea exactos. Un hallazgo sin línea concreta casi siempre
              significa que no lo has localizado del todo.
            - Después, **un único** comentario con `gh pr comment`: dos o tres frases sobre
              qué hace la PR y, si los hay, la lista de hallazgos bloqueantes. Nada más.

            PROHIBIDO en lo que publiques:

            - Listas de tareas o casillas marcables (`- [ ]`, `- [x]`) de cualquier tipo,
              tanto de tu proceso de revisión como de comprobaciones pendientes. No estás
              llevando un plan: estás revisando código.
            - Narrar lo que vas haciendo ("Leyendo CLAUDE.md", "Obteniendo el diff").
            - Repetir en el resumen lo que ya has dicho en un comentario en línea.
            - Elogios genéricos.

            Prioriza, en este orden:

            1. **Violaciones de la regla de dependencias.** `shared/domain` no puede importar
               nada de `data`, `presentation`, Firebase, Android ni iOS. `composeApp` no puede
               importar `shared.data` directamente. Esto es bloqueante siempre.
            2. **Fugas de plataforma en `commonMain`.** Nada de `android.*`, `java.*`,
               `platform.Foundation.*` fuera de `androidMain`/`iosMain`.
            3. **Corrección y concurrencia.** Dispatchers hardcodeados en vez de
               `DispatcherProvider`, corrutinas sin scope, `runBlocking` en producción,
               `GlobalScope`, estado mutable compartido.
            4. **Seguridad.** Claves, tokens o URLs de Firebase hardcodeadas; reglas de
               Firestore permisivas; PII en logs; `google-services.json` commiteado.
            5. **Manejo de errores.** Excepciones cruzando fronteras de capa en vez de
               `AppResult`; `catch (e: Exception)` vacíos.
            6. **Tests.** Todo caso de uso nuevo o modificado en `domain` necesita test en
               `commonTest`. Sin test => bloqueante.
            7. **Criterios de aceptación de la issue.** Si el cuerpo de la PR referencia una
               issue (`Closes #N`), léela y comprueba que se cumplen todos sus criterios.

            NO comentes sobre: formato (lo cubre ktlint), preferencias de estilo subjetivas,
            ni nombres que sean simplemente distintos a los que tú elegirías. Nada de elogios
            genéricos. Si el código está bien, dilo en una línea.

            IMPORTANTE — termina tu RESPUESTA EN EL CHAT con una única línea, exactamente en
            este formato y sin nada más después. Esta línea es fontanería para el workflow:
            no la incluyas en los comentarios que publicas en GitHub.

            VEREDICTO: request_changes

            o bien:

            VEREDICTO: approve

            Usa `approve` sólo si no hay ningún hallazgo bloqueante.

      # ------------------------------------------------------------ #
      # Extracts the verdict from the transcript. grep over the file is format-agnostic:
      # if the text is there, it finds it.
      # ------------------------------------------------------------ #
      - name: Interpret the verdict
        id: verdict
        if: steps.gate.outputs.skip != 'true'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          echo "action conclusion: '$CONCLUSION'"
          echo "step outcome:      '$OUTCOME'"
          echo "execution_file: '$EXEC_FILE'"

          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::No execution file. The review never completed."
            exit 1
          fi

          # The action fails when the review spends more turns than configured, even having
          # finished and published. That is not a finding, and mistaking it for one blocks
          # an approved pull request: if the transcript holds a verdict, the verdict wins.
          if [ "$OUTCOME" = "failure" ]; then
            if grep -q "exceeding the configured maximum\|error_max_turns" "$EXEC_FILE"; then
              echo "::warning::The review ran out of turns (--max-turns)."
              echo "This is NOT a finding. A published verdict still counts; raise it if this recurs."
            else
              echo "::warning::The action failed. The verdict still counts if it was emitted."
            fi
          fi

          echo "--- últimos 2000 caracteres de la transcripción ---"
          tail -c 2000 "$EXEC_FILE"
          echo ""
          echo "--- fin ---"

          # El último centinela gana: si Claude se corrige a sí mismo, vale el final.
          VERDICT=$(grep -oE 'VEREDICTO: (approve|request_changes)' "$EXEC_FILE" \
                    | tail -1 | awk '{print $2}')

          case "$VERDICT" in
            approve|request_changes)
              echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
              echo "Verdict: $VERDICT"
              ;;
            *)
              # A missing verdict is NOT a rejection: it is a broken review. Telling them
              # apart matters, or every breakage looks like a real finding.
              if grep -q "exceeding the configured maximum\|error_max_turns" "$EXEC_FILE"; then
                echo "::error::The review ran out of turns before emitting a verdict."
                echo "Not a finding: raise --max-turns. See docs/infra.md."
              else
                echo "::error::Claude emitted no recognisable verdict. Review inconclusive."
              fi
              exit 1
              ;;
          esac

      # ------------------------------------------------------------ #
      # The label mirrors the verdict. The action publishes the detailed comment itself, so
      # nothing is duplicated here.
      # ------------------------------------------------------------ #
      - name: Label the pull request
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AI_REVIEWER_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "approve" ]; then
            gh pr edit "$PR" --add-label "ai-review:approved"
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --approve --body "No blocking findings."
          else
            gh pr edit "$PR" --remove-label "ai-review:approved" || true
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --request-changes --body "Blocking findings; detail in the comments."
          fi
          exit 0

      # ------------------------------------------------------------ #
      # Makes "Claude review" usable as a required status check.
      # ------------------------------------------------------------ #
      - name: Block if there are findings
        if: steps.verdict.outputs.verdict == 'request_changes'
        run: |
          echo "::error::The review found blocking problems."
          exit 1
