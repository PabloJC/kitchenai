name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write        # necesario para el action de Claude

jobs:
  review:
    name: Claude review
    # No revisamos borradores ni PRs marcadas para saltarse la revisión.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # Claude necesita el historial para el diff

      # ------------------------------------------------------------ #
      # Claude revisa el diff contra CLAUDE.md, deja comentarios inline
      # y publica su propio comentario resumen (lo hace el action).
      #
      # El veredicto viaja como una línea centinela al final de su
      # respuesta, no como structured_output: `--json-schema` devolvía
      # siempre vacío, sin error, y no conseguimos averiguar por qué.
      # Un centinela de texto es inmune al formato de la transcripción.
      # ------------------------------------------------------------ #
      - name: Revisión con Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          # Permisos en `settings`, no en --allowedTools: claude_args se parsea
          # como línea de shell y los paréntesis de `Bash(git diff:*)` rompen
          # el resto de la lista.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Read",
                  "Grep",
                  "Glob",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh issue view:*)"
                ],
                "deny": ["Write", "Edit", "Bash(git push:*)", "Bash(git commit:*)"]
              }
            }
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
          prompt: |
            Eres el revisor de código del proyecto KitchenAI (Kotlin Multiplatform + Compose Multiplatform + Firebase).

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} — "${{ github.event.pull_request.title }}"
            BASE: ${{ github.event.pull_request.base.ref }}

            Lee `CLAUDE.md` antes de opinar: contiene las reglas vinculantes de este repositorio.

            Revisa ÚNICAMENTE el diff de esta PR. Para cada problema real deja un comentario
            inline en la línea concreta. Prioriza, en este orden:

            1. **Violaciones de la regla de dependencias.** `shared/domain` no puede importar
               nada de `data`, `presentation`, Firebase, Android ni iOS. `composeApp` no puede
               importar `shared.data` directamente. Esto es bloqueante siempre.
            2. **Fugas de plataforma en `commonMain`.** Nada de `android.*`, `java.*`,
               `platform.Foundation.*` fuera de `androidMain`/`iosMain`.
            3. **Corrección y concurrencia.** Dispatchers hardcodeados en vez de
               `DispatcherProvider`, corrutinas sin scope, `runBlocking` en producción,
               `GlobalScope`, estado mutable compartido.
            4. **Seguridad.** Claves, tokens o URLs de Firebase hardcodeadas; reglas de
               Firestore permisivas; PII en logs; `google-services.json` commiteado.
            5. **Manejo de errores.** Excepciones cruzando fronteras de capa en vez de
               `AppResult`; `catch (e: Exception)` vacíos.
            6. **Tests.** Todo caso de uso nuevo o modificado en `domain` necesita test en
               `commonTest`. Sin test => bloqueante.
            7. **Criterios de aceptación de la issue.** Si el cuerpo de la PR referencia una
               issue (`Closes #N`), léela y comprueba que se cumplen todos sus criterios.

            NO comentes sobre: formato (lo cubre ktlint), preferencias de estilo subjetivas,
            ni nombres que sean simplemente distintos a los que tú elegirías. Nada de elogios
            genéricos. Si el código está bien, dilo en una línea.

            IMPORTANTE — termina tu respuesta con una única línea, exactamente en este formato
            y sin nada más después:

            VEREDICTO: request_changes

            o bien:

            VEREDICTO: approve

            Usa `approve` sólo si no hay ningún hallazgo bloqueante.

      # ------------------------------------------------------------ #
      # Extrae el veredicto de la transcripción. grep sobre el fichero
      # es agnóstico al formato: si el texto está, lo encuentra.
      # ------------------------------------------------------------ #
      - name: Interpretar veredicto
        id: verdict
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          echo "conclusion del action: '$CONCLUSION'"
          echo "execution_file: '$EXEC_FILE'"

          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::No hay fichero de ejecución. La revisión no llegó a completarse."
            exit 1
          fi

          echo "--- últimos 2000 caracteres de la transcripción ---"
          tail -c 2000 "$EXEC_FILE"
          echo ""
          echo "--- fin ---"

          # El último centinela gana: si Claude se corrige a sí mismo, vale el final.
          VERDICT=$(grep -oE 'VEREDICTO: (approve|request_changes)' "$EXEC_FILE" \
                    | tail -1 | awk '{print $2}')

          case "$VERDICT" in
            approve|request_changes)
              echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
              echo "Veredicto: $VERDICT"
              ;;
            *)
              # Un veredicto ausente NO es un rechazo: es una revisión rota.
              # Distinguirlo importa; si no, toda avería parece un hallazgo real.
              echo "::error::Claude no emitió un veredicto reconocible. Revisión no concluyente."
              exit 1
              ;;
          esac

      # ------------------------------------------------------------ #
      # La etiqueta refleja el veredicto. El comentario con el detalle
      # lo publica el propio action (use_sticky_comment), así que aquí
      # no duplicamos nada.
      # ------------------------------------------------------------ #
      - name: Etiquetar la PR
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AI_REVIEWER_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "approve" ]; then
            gh pr edit "$PR" --add-label "ai-review:approved"
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --approve --body "Sin hallazgos bloqueantes."
          else
            gh pr edit "$PR" --remove-label "ai-review:approved" || true
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --request-changes --body "Hallazgos bloqueantes; detalle en los comentarios."
          fi
          exit 0

      # ------------------------------------------------------------ #
      # Hace que "Claude review" sirva como required status check.
      # ------------------------------------------------------------ #
      - name: Bloquear si hay hallazgos
        if: steps.verdict.outputs.verdict == 'request_changes'
        run: |
          echo "::error::La revisión de Claude encontró problemas bloqueantes."
          exit 1
