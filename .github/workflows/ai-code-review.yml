name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write        # required by the Claude action

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------ #
      # The skip must NOT live in the job's `if:`. This job is a required status check: if
      # it does not run it does not report, and a pull request waiting on a check that never
      # arrives is blocked for good. This way the job always finishes, green, without
      # reviewing.
      # ------------------------------------------------------------ #
      - name: Should we review?
        id: gate
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ai-review') }}
        run: |
          if [ "$DRAFT" = "true" ] || [ "$SKIP_LABEL" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Draft or skip-ai-review label: not reviewing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0        # Claude needs the history for the diff

      # ------------------------------------------------------------ #
      # Claude reviews the diff against CLAUDE.md, leaves inline comments and publishes its
      # own summary comment.
      #
      # The verdict travels as a sentinel line at the end of the response rather than as
      # structured_output: `--json-schema` always came back empty, with no error and no
      # explanation. A text sentinel is immune to the transcript's format.
      # ------------------------------------------------------------ #
      - name: Review with Claude
        id: claude
        if: steps.gate.outputs.skip != 'true'
        # The action's failure does not decide the check: the verdict does, in the next
        # step. Without this, exhausting the turn budget aborts the job and skips both the
        # label and the gate, leaving an approved pull request with no verdict and a red
        # check.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `track_progress`: it produces a tracking comment with tickable boxes, and a
          # review is not a to-do list. Without it, the review is the inline comments plus a
          # short summary.
          #
          # Denials only here. The allow list goes in --allowedTools:
          # `settings.permissions.allow` does not always reach the SDK, and Claude ends up
          # hitting denials when trying to comment.
          settings: |
            {
              "permissions": {
                "deny": ["Write", "Edit", "Bash(git push:*)", "Bash(git commit:*)"]
              }
            }
          # No --model: the action's default.
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
          prompt: |
            You are the code reviewer for KitchenAI (Kotlin Multiplatform + Compose Multiplatform + Firebase).

            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} — "${{ github.event.pull_request.title }}"
            BASE: ${{ github.event.pull_request.base.ref }}

            Read `CLAUDE.md` before forming an opinion: it holds this repository's binding rules.

            Review ONLY the diff of this pull request.

            HOW TO PUBLISH THE REVIEW — this is not optional. Nobody reads your reply in the
            chat; if you do not publish on GitHub, the review does not exist.

            - The bulk of the review is **inline comments**:
              `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`, on
              the exact file and line. A finding without a concrete line almost always means
              you have not pinned it down.
            - Then **a single** comment with `gh pr comment`: two or three sentences on what
              the pull request does and, if any, the list of blocking findings. Nothing else.

            FORBIDDEN in what you publish:

            - Task lists or tickable boxes (`- [ ]`, `- [x]`) of any kind, whether about your
              review process or about pending checks. You are not tracking a plan: you are
              reviewing code.
            - Narrating what you are doing ("Reading CLAUDE.md", "Fetching the diff").
            - Repeating in the summary what an inline comment already says.
            - Generic praise.

            Prioritise, in this order:

            1. **Dependency rule violations.** `shared/domain` cannot import anything from
               `data`, `presentation`, Firebase, Android or iOS. `composeApp` cannot import
               `shared.data` directly. Always blocking.
            2. **Platform leaks in `commonMain`.** No `android.*`, `java.*` or
               `platform.Foundation.*` outside `androidMain`/`iosMain`.
            3. **Correctness and concurrency.** Hardcoded dispatchers instead of
               `DispatcherProvider`, coroutines without a scope, `runBlocking` in production,
               `GlobalScope`, shared mutable state.
            4. **Security.** Hardcoded Firebase keys, tokens or URLs; permissive Firestore
               rules; PII in logs; `google-services.json` committed.
            5. **Error handling.** Exceptions crossing layer boundaries instead of
               `AppResult`; empty `catch (e: Exception)`.
            6. **Tests.** Every new or modified use case in `domain` needs a test in
               `commonTest`. No test => blocking.
            7. **The issue's acceptance criteria.** If the body references an issue
               (`Closes #N`), read it and check every criterion is met.

            Do NOT comment on: formatting (ktlint covers it), subjective style preferences, or
            names that are merely different from the ones you would have picked. No generic
            praise. If the code is fine, say so in one line.

            Write the review in English.

            IMPORTANT — end your REPLY IN THE CHAT with a single line, in exactly this format
            and with nothing after it. That line is plumbing for the workflow: do not include
            it in what you publish on GitHub.

            VERDICT: request_changes

            or else:

            VERDICT: approve

            Use `approve` only if there is no blocking finding.

      # ------------------------------------------------------------ #
      # Extracts the verdict from the transcript. grep over the file is format-agnostic:
      # if the text is there, it finds it.
      # ------------------------------------------------------------ #
      - name: Interpret the verdict
        id: verdict
        if: steps.gate.outputs.skip != 'true'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          echo "action conclusion: '$CONCLUSION'"
          echo "step outcome:      '$OUTCOME'"
          echo "execution_file: '$EXEC_FILE'"

          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::No execution file. The review never completed."
            exit 1
          fi

          # The action fails when the review spends more turns than configured, even having
          # finished and published. That is not a finding, and mistaking it for one blocks
          # an approved pull request: if the transcript holds a verdict, the verdict wins.
          if [ "$OUTCOME" = "failure" ]; then
            if grep -q "exceeding the configured maximum\|error_max_turns" "$EXEC_FILE"; then
              echo "::warning::The review ran out of turns (--max-turns)."
              echo "This is NOT a finding. A published verdict still counts; raise it if this recurs."
            else
              echo "::warning::The action failed. The verdict still counts if it was emitted."
            fi
          fi

          echo "--- últimos 2000 caracteres de la transcripción ---"
          tail -c 2000 "$EXEC_FILE"
          echo ""
          echo "--- fin ---"

          # El último centinela gana: si Claude se corrige a sí mismo, vale el final.
          VERDICT=$(grep -oE 'VERDICT: (approve|request_changes)' "$EXEC_FILE" \
                    | tail -1 | awk '{print $2}')

          case "$VERDICT" in
            approve|request_changes)
              echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
              echo "Verdict: $VERDICT"
              ;;
            *)
              # A missing verdict is NOT a rejection: it is a broken review. Telling them
              # apart matters, or every breakage looks like a real finding.
              if grep -q "exceeding the configured maximum\|error_max_turns" "$EXEC_FILE"; then
                echo "::error::The review ran out of turns before emitting a verdict."
                echo "Not a finding: raise --max-turns. See docs/infra.md."
              else
                echo "::error::Claude emitted no recognisable verdict. Review inconclusive."
              fi
              exit 1
              ;;
          esac

      # ------------------------------------------------------------ #
      # The label mirrors the verdict. The action publishes the detailed comment itself, so
      # nothing is duplicated here.
      # ------------------------------------------------------------ #
      - name: Label the pull request
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AI_REVIEWER_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "approve" ]; then
            gh pr edit "$PR" --add-label "ai-review:approved"
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --approve --body "No blocking findings."
          else
            gh pr edit "$PR" --remove-label "ai-review:approved" || true
            [ "$HAS_PAT" = "true" ] && gh pr review "$PR" --request-changes --body "Blocking findings; detail in the comments."
          fi
          exit 0

      # ------------------------------------------------------------ #
      # Makes "Claude review" usable as a required status check.
      # ------------------------------------------------------------ #
      - name: Block if there are findings
        if: steps.verdict.outputs.verdict == 'request_changes'
        run: |
          echo "::error::The review found blocking problems."
          exit 1
