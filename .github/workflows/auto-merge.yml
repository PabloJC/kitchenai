name: Auto-merge

# Replaces GitHub's native auto-merge, which needs branch protection and is therefore
# unavailable on private repositories on the Free plan.
#
# The contract: label a pull request `ready-to-merge` and, once CI and the review are green,
# it squash-merges itself and deletes the branch. A failing check costs nothing — fix, push,
# and this workflow retries on its own when everything goes green again.

on:
  # When CI or the review finishes: that may have been the last pending check.
  workflow_run:
    workflows: ["CI", "AI Code Review"]
    types: [completed]
  # When the pull request is labelled: the checks may already be green.
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge if everything is green
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          LABEL: ready-to-merge
          # Must match the `name:` of the two jobs that gate main (docs/infra.md).
          REQUIRED: '["CI passed", "Claude review"]'
        run: |
          set -euo pipefail

          # ---------------------------------------------------------- #
          # 1. Which pull requests to look at.
          #
          # `pull_request` tells us. `workflow_run` only carries the SHA, so we look for
          # open pull requests whose head matches.
          # ---------------------------------------------------------- #
          if [ "$EVENT" = "pull_request" ]; then
            PRS="$PR_NUM"
          else
            PRS=$(gh pr list --state open --json number,headRefOid \
                  --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\") | .number] | .[]")
          fi

          if [ -z "$PRS" ]; then
            echo "No open pull request matches this event."
            exit 0
          fi

          for PR in $PRS; do
            echo "::group::PR #$PR"

            DATA=$(gh pr view "$PR" --json isDraft,labels,mergeable,state)
            STATE=$(echo "$DATA" | jq -r .state)
            DRAFT=$(echo "$DATA" | jq -r .isDraft)
            MERGEABLE=$(echo "$DATA" | jq -r .mergeable)
            HAS_LABEL=$(echo "$DATA" | jq -r --arg l "$LABEL" \
                        '[.labels[].name] | index($l) != null')

            if [ "$STATE" != "OPEN" ];    then echo "Not open."; echo "::endgroup::"; continue; fi
            if [ "$HAS_LABEL" != "true" ]; then echo "No '$LABEL' label: leaving it alone."; echo "::endgroup::"; continue; fi
            if [ "$DRAFT" = "true" ];      then echo "It is a draft."; echo "::endgroup::"; continue; fi

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "Conflicts with the base. Resolve them and label it again."
              gh pr comment "$PR" --body "Auto-merge stopped: the branch conflicts with \`main\`."
              echo "::endgroup::"; continue
            fi

            # ---------------------------------------------------------- #
            # 2. The two required checks green (#416).
            #
            # Not "every check": the board sync and this job are checks of the pull request
            # too, and neither says anything about the code. A required check that has not
            # reported yet counts as missing, never as green.
            # ---------------------------------------------------------- #
            MISSING=$(gh pr checks "$PR" --json name,bucket | jq -r --argjson req "$REQUIRED" \
              '. as $c | $req[] | . as $n
               | select(([$c[] | select(.name == $n)] | length) == 0
                        or any($c[]; .name == $n and .bucket != "pass"))')

            if [ -n "$MISSING" ]; then
              echo "Not merging. Required checks failing, pending or absent:"
              echo "$MISSING" | sed 's/^/  /'
              echo "::endgroup::"; continue
            fi

            echo "All green. Merging."
            gh pr merge "$PR" --squash --delete-branch
            echo "::endgroup::"
          done
