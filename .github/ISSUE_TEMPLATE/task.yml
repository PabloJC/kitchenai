name: Development task
description: A unit of work with its own plan, ready for an agent to implement
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one branch = one pull request. If filling this in reveals two
        separate things, they are two issues.

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: "Sets the branch prefix and the commit type — `feat/12-recipe-list`, `feat(domain): ...`"
      options:
        - feat
        - fix
        - chore
        - docs
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - domain
        - data
        - presentation
        - infra
        - docs
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem this solves and why now. Not how it is solved.
      placeholder: |
        The recipe screen has nowhere to read data from: neither the repository port
        nor its Firestore implementation exist yet.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Development plan
      description: |
        The concrete steps, in order. Each step must be verifiable on its own.
        An agent will follow this, so ambiguity here gets paid for later.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files affected
      description: |
        One per line, with its path. This is what makes parallel work possible:
        two issues touching the same file cannot be developed at the same time.
      placeholder: |
        shared/src/commonMain/kotlin/com/kitchenai/shared/domain/port/RecipeRepository.kt
        shared/src/commonMain/kotlin/com/kitchenai/shared/data/repository/RecipeRepositoryImpl.kt
        shared/src/commonTest/kotlin/com/kitchenai/shared/data/repository/RecipeRepositoryImplTest.kt
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: |
        As a checkable list. The reviewer takes these literally when deciding whether
        the pull request delivers what it claims to close.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be done first. Leave empty if there are none.
      placeholder: "Blocked by #4, #7"

  - type: checkboxes
    id: preflight
    attributes:
      label: Before opening
      options:
        - label: No open issue already claims any of the files listed above
          required: true
        - label: The plan does not depend on decisions that have not been made yet
          required: true
