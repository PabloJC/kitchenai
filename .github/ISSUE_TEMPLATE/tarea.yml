name: Tarea de desarrollo
description: Una unidad de trabajo con su plan, lista para que la implemente un agente
title: "feat: "
labels: ["tarea"]
body:
  - type: markdown
    attributes:
      value: |
        Una issue = una rama = una PR. Si al rellenar esto ves que son dos cosas,
        son dos issues.

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qué problema resuelve y por qué ahora. No cómo se resuelve.
      placeholder: |
        La pantalla de recetas no tiene de dónde leer los datos: no existe el puerto
        del repositorio ni su implementación contra Firestore.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan de desarrollo
      description: |
        Los pasos concretos, en orden. Cada paso debe ser verificable por separado.
        Es lo que va a seguir el agente, así que la ambigüedad aquí se paga después.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: ficheros
    attributes:
      label: Ficheros afectados
      description: |
        Uno por línea, con su ruta. Sirve para detectar colisiones con otras issues
        antes de empezar: dos tareas que tocan el mismo fichero no van en paralelo.
      placeholder: |
        shared/src/commonMain/kotlin/com/kitchenai/shared/domain/port/RecipeRepository.kt
        shared/src/commonMain/kotlin/com/kitchenai/shared/data/repository/RecipeRepositoryImpl.kt
        shared/src/commonTest/kotlin/com/kitchenai/shared/data/repository/RecipeRepositoryImplTest.kt
    validations:
      required: true

  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptación
      description: |
        En forma de lista comprobable. El revisor los usa literalmente para decidir
        si la PR cumple lo que dice cerrar.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: input
    id: dependencias
    attributes:
      label: Dependencias
      description: Issues que tienen que estar hechas antes. Vacío si no hay ninguna.
      placeholder: "Blocked by #4, #7"

  - type: dropdown
    id: capa
    attributes:
      label: Capa
      options:
        - domain
        - data
        - presentation
        - infra
        - docs
    validations:
      required: true

  - type: checkboxes
    id: recordatorio
    attributes:
      label: Antes de abrir la issue
      options:
        - label: He comprobado que ningún fichero de la lista lo toca otra issue abierta
          required: true
        - label: El plan no depende de decisiones que aún no se han tomado
          required: true
