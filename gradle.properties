org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true

# AGP 9: sin android.builtInKotlin=false ni android.newDsl=false.
# La incompatibilidad KMP + com.android.application se resuelve separando
# :androidApp del código compartido, no con flags que mueren en AGP 10.

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
