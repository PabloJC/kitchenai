org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true

# AGP 9: no android.builtInKotlin=false, no android.newDsl=false.
# The KMP + com.android.application incompatibility is solved by separating
# :androidApp from the shared code, not with flags that die in AGP 10.

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Apple targets cannot be compiled on Linux (CI). Without this, Gradle warns on
# every build that iosSimulatorArm64Test is disabled.
kotlin.native.ignoreDisabledTargets=true

# Where the suggestRecipes function is deployed. Configuration rather than a constant in
# :shared, and it must match FUNCTIONS_REGION in functions/ — the client and the deployment
# change together or the call reaches nothing. Override with -Pkitchenai.functionsRegion=…
kitchenai.functionsRegion=europe-southwest1
