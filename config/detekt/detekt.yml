build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInClasses: 20
    ignorePrivate: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    # Composables are PascalCase
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  # Replaces a ForbiddenMethodCall pair that never fired: that rule needs type resolution,
  # which no task has for commonMain. An import ban is syntactic, so it holds everywhere.
  # Its println half has no syntactic equivalent and stays unenforced for now.
  ForbiddenImport:
    active: true
    imports:
      - reason: 'Inject DispatcherProvider; only its implementations may name a dispatcher'
        value: 'kotlinx.coroutines.Dispatchers'
    excludes:
      # The implementations of the port itself, and test setup that must reach Dispatchers.Main.
      - '**/DispatcherProvider*.kt'
      - '**/commonTest/**'
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    # @Preview composables are unused by construction: the IDE renders them, nothing calls them.
    ignoreAnnotated: ['Preview']
