# detekt 2 dropped `build.maxIssues`: the build now fails on any issue whose severity is `error`,
# which every rule here is. The effect is what `maxIssues: 0` used to buy, and there is no baseline.

complexity:
  LongMethod:
    allowedLines: 60
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    # A private helper is not part of what a reader has to hold in their head at once.
    ignorePrivate: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    # Composables are PascalCase
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  # Needs type resolution, which only the compilation tasks have. Those cover commonMain and
  # androidMain; nothing typed reaches iosMain, so the import ban below still earns its place.
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'A log line carries the user own content to a device log'
        value: 'kotlin.io.println'
  ForbiddenImport:
    active: true
    forbiddenImports:
      - reason: 'Inject DispatcherProvider; only its implementations may name a dispatcher'
        value: 'kotlinx.coroutines.Dispatchers'
    excludes:
      # The implementations of the port itself, and test setup that must reach Dispatchers.Main.
      - '**/DispatcherProvider*.kt'
      - '**/commonTest/**'
  ReturnCount:
    max: 4
  # Was UnusedPrivateMember, which detekt 2 split in two.
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
