build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInClasses: 20
    ignorePrivate: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    # Composables are PascalCase
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Use DispatcherProvider, not a hardcoded dispatcher'
        value: 'kotlinx.coroutines.Dispatchers.IO'
      - reason: 'println leaks data and is invisible in production; use the logger'
        value: 'kotlin.io.println'
  ReturnCount:
    max: 4
