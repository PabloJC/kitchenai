[versions]
# --- Toolchain ---------------------------------------------------------------
kotlin              = "2.4.10"
agp                 = "9.0.1"
composeMultiplatform = "1.11.1"
jvmTarget           = "17"

# --- Android -----------------------------------------------------------------
androidCompileSdk   = "36"
androidMinSdk       = "26"
androidTargetSdk    = "36"
androidxActivity    = "1.13.0"
androidxLifecycle   = "2.11.0-beta01"

# --- Libraries ---------------------------------------------------------------
gitliveFirebase     = "2.5.0"   # 2.6.0 did not publish dev.gitlive:firebase-app to Maven Central
firebaseBom         = "34.9.0"
googleServices      = "4.4.3"
koin                = "4.1.0"
coroutines          = "1.10.2"
kotlinxDatetime     = "0.7.1"
kotlinxSerialization = "1.9.0"

# --- Test --------------------------------------------------------------------
turbine             = "1.2.1"

# --- Calidad -----------------------------------------------------------------
detekt              = "1.23.8"
ktlint              = "12.1.2"

[libraries]
# GitLive: a single Firebase API for commonMain
gitlive-firebase-app       = { module = "dev.gitlive:firebase-app",       version.ref = "gitliveFirebase" }
gitlive-firebase-common    = { module = "dev.gitlive:firebase-common",    version.ref = "gitliveFirebase" }
gitlive-firebase-auth      = { module = "dev.gitlive:firebase-auth",      version.ref = "gitliveFirebase" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitliveFirebase" }
gitlive-firebase-storage   = { module = "dev.gitlive:firebase-storage",   version.ref = "gitliveFirebase" }

# Native Android Firebase (analytics/crashlytics are not in GitLive)
firebase-bom         = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics   = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# App Check. No version: the BOM sets it, and :shared exports the BOM as `api`.
# The -debug artefact must NOT end up in release: it is consumed from
# debugImplementation, not from implementation.
firebase-appcheck               = { module = "com.google.firebase:firebase-appcheck" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-appcheck-debug         = { module = "com.google.firebase:firebase-appcheck-debug" }

koin-core             = { module = "io.insert-koin:koin-core",                version.ref = "koin" }
koin-android          = { module = "io.insert-koin:koin-android",             version.ref = "koin" }
koin-compose          = { module = "io.insert-koin:koin-compose",             version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel",  version.ref = "koin" }

kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication   = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary    = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform  = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices       = { id = "com.google.gms.google-services", version.ref = "googleServices" }
detekt               = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
